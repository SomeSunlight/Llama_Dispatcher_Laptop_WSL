name: "Thinkpad_SYCL_gemma_12B"
description: "Gemma 4 12B QAT profile for the Intel integrated GPU through SYCL/Level Zero; 16K context with conservative 256 batch and ubatch settings."

defaults:
  model: "gemma"
  engine: "sycl"

common:
  m: "${LLAMA_MODEL_ROOT}/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf"
  c: 16384
  threads: 6
  cache-type-k: "q4_0"
  cache-type-v: "q4_0"

serve:
  ubatch-size: 256
  batch-size: 256
  parallel: 1
  cont-batching: true
  jinja: true
  port: 8081
  host: "0.0.0.0"
  cache-ram: 0
  ctx-checkpoints: 0

bench:
  r: 1
  pg:
    - [512, 128]
    - [1024, 128]
    - [2048, 128]
    - [4096, 128]
    - [8192, 128]
    - [16384, 128]
    - [32768, 128]
    - [65536, 128]
    - ["MAX_CONTEXT", 128]

eval:
  c: 8192
  b: 512
  ot: null

name: "Thinkpad_vulkan_gemma_26B_A4B"
description: "Gemma 4 26B-A4B QAT workhorse profile for Intel Vulkan experiments; 16K context and Q4 KV cache with Vulkan offload policy supplied by the engine."

defaults:
  model: "gemma"
  engine: "vulkan-intel"

common:
  m: "${LLAMA_MODEL_ROOT}/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
  c: 16384
  threads: 1
  cache-type-k: "q4_0"
  cache-type-v: "q4_0"
  flash-attn: true
  n-gpu-layers: 99

serve:
  ubatch-size: 2048
  batch-size: 2048
  parallel: 1
  cont-batching: true
  jinja: true
  ctx-checkpoints: 0

bench:
  r: 1
  pg:
    - [512, 128]
    - [1024, 128]
    - [2048, 128]
    - [4096, 128]
    - [8192, 128]
    - [16384, 128]
    - [32768, 128]
    - [65536, 128]
    - ["MAX_CONTEXT", 128]

eval:
  c: 8192
  b: 512
  ot: null

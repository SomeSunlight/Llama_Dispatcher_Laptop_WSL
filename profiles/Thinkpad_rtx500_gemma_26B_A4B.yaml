name: "Thinkpad_rtx500_gemma_26B_A4B"
description: "Gemma 4 26B-A4B QAT profile for the RTX 500 Ada through Vulkan; constrained 2K context with partial GPU offload and selected tensors kept on CPU."

defaults:
  model: "gemma"
  engine: "vulkan-rtx500"

common:
  m: "${LLAMA_MODEL_ROOT}/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
  c: 2048
  threads: 16
  cache-type-k: "q8_0"
  cache-type-v: "q8_0"
  n-gpu-layers: 8
  ot: "per_layer_token_embd\\.weight=CPU"
  override-tensor: "token_embd.*=CPU,output.*=CPU"
  no-mmap: true

serve:
  ubatch-size: 2048
  batch-size: 2048
  parallel: 1
  cont-batching: true
  jinja: true
  port: 8081
  host: "0.0.0.0"
  kv-unified: true
  ctx-checkpoints: 0

bench:
  r: 1
  pg:
    - [512, 128]
    - [32768, 128]
    - [65536, 128]
    - ["MAX_CONTEXT", 128]

eval:
  c: 8192
  b: 512
  ot: null

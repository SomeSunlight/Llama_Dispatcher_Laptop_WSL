name: "Thinkpad_vulkan_gemma_26B_A4B_planner"
description: "Conservative Gemma 4 26B-A4B QAT planner profile for Intel Vulkan experiments; 16K context with smaller batch settings and four CPU threads for stability."

defaults:
  model: "gemma"
  engine: "vulkan-intel"

common:
  m: "${LLAMA_MODEL_ROOT}/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
  c: 16384
  threads: 4
  cache-type-k: "q4_0"
  cache-type-v: "q4_0"
  flash-attn: true
  n-gpu-layers: 99

serve:
  ubatch-size: 512
  batch-size: 256
  parallel: 1
  cont-batching: true
  jinja: true
  # Standalone profile defaults. Ensemble mode uses ensemble.engine host/port instead.
  port: 8081
  host: "0.0.0.0"
  ctx-checkpoints: 0

bench:
  r: 1
  pg:
    - [512, 128]
    - [1024, 128]
    - [2048, 128]
    - [4096, 128]
    - [8192, 128]
    - [16384, 128]
    - [32768, 128]
    - [65536, 128]
    - ["MAX_CONTEXT", 128]

eval:
  c: 8192
  b: 512
  ot: null

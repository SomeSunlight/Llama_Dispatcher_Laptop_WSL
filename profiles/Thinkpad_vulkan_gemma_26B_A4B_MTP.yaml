name: "Thinkpad_vulkan_gemma_26B_A4B_MTP"
description: "MTP speculative-decoding variant of the Gemma 4 26B-A4B QAT profile for Intel Vulkan experiments; 64K context and Q8 KV cache."

defaults:
  model: "gemma"
  engine: "vulkan-intel"

common:
  m: "${LLAMA_MODEL_ROOT}/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
  c: 65536
  threads: 16
  cache-type-k: "q8_0"
  cache-type-v: "q8_0"

serve:
  image-min-tokens: 300
  image-max-tokens: 512
  ubatch-size: 2048
  batch-size: 2048
  parallel: 1
  cont-batching: true
  jinja: true
  port: 8081
  host: "0.0.0.0"
  spec-type: "draft-mtp"
  spec-draft-n-max: 1
  model-draft: "${LLAMA_MODEL_ROOT}/mtp-gemma-4-26B-A4B-it.gguf"

bench:
  r: 1
  pg:
    - [512, 128]
    - [1024, 128]
    - [2048, 128]
    - [4096, 128]
    - [8192, 128]
    - [16384, 128]
    - [32768, 128]
    - [65536, 128]
    - ["MAX_CONTEXT", 128]

eval:
  c: 8192
  b: 512
  ot: null

name: "Thinkpad_vulkan_Qwen_35B_A3B"
description: "Test qwen"

defaults:
  model: "qwen"
  engine: "vulkan-intel"

common:
  m: "${LLAMA_MODEL_ROOT}/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf"
  c: 8192
  threads: 3
  cache-type-k: "q4_0"
  cache-type-v: "q4_0"
  flash-attn: true
  n-gpu-layers: 99

serve:
  ubatch-size: 2048
  batch-size: 2048
  parallel: 1
  cont-batching: true
  jinja: true
  ctx-checkpoints: 0
  no-kv-offload: false

bench:
  r: 1
  pg:
    - [512, 128]
    - [1024, 128]
    - [2048, 128]
    - [4096, 128]
    - [8192, 128]
    - [16384, 128]
    - [32768, 128]
    - [65536, 128]
    - ["MAX_CONTEXT", 128]

eval:
  c: 8192
  b: 512
  ot: null

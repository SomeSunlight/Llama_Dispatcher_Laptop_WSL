name: "Thinkpad_vulkan_gemma_12B"
description: "Gemma 4 12B QAT profile for Intel Vulkan experiments; currently uses a 64K context with GPU layer offload explicitly disabled."

defaults:
  model: "gemma"
  engine: "vulkan-intel"

common:
  m: "${LLAMA_MODEL_ROOT}/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf"
  c: 65536
  threads: 6
  cache-type-k: "q4_0"
  cache-type-v: "q4_0"
  n-gpu-layers: 0

serve:
  ubatch-size: 2048
  batch-size: 2048
  parallel: 1
  cont-batching: true
  jinja: true
  port: 8081
  host: "0.0.0.0"
  cache-ram: 0
  ctx-checkpoints: 0

bench:
  r: 1
  pg:
    - [512, 128]
    - [1024, 128]
    - [2048, 128]
    - [4096, 128]
    - [8192, 128]
    - [16384, 128]
    - [32768, 128]
    - [65536, 128]
    - ["MAX_CONTEXT", 128]

eval:
  c: 8192
  b: 512
  ot: null

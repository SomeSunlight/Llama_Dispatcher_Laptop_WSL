# Intel Vulkan engine for the Laptop_WSL instance.
# AI Workstation supplies the concrete llama.cpp binary directory at runtime.

environment:
  GGML_VK_VISIBLE_DEVICES: "0"

common:
  split-mode: none
  main-gpu: 0

# Defaults for direct single-profile serve. Ensembles own their router host/port.
serve:
  host: "0.0.0.0"
  port: 8081
  # Laptop Vulkan baseline: keep KV cache in host/shared memory by default.
  # Profiles may override this only for a backend/model combination validated separately.
  no-kv-offload: true
  cache-ram: 0

# Intel SYCL / Level Zero engine for the Laptop_WSL instance.
# AI Workstation supplies the concrete llama.cpp binary directory at runtime.

environment:
  ONEAPI_DEVICE_SELECTOR: "level_zero:0"
  ZES_ENABLE_SYSMAN: "1"

common:
  split-mode: none
  main-gpu: 0

# Defaults for direct single-profile serve. Ensembles own their router host/port.
serve:
  host: "0.0.0.0"
  port: 8081

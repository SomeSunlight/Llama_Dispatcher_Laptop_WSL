# Intel SYCL engine for the Laptop instance.

environment:
  # Prefer the Level Zero GPU deterministically instead of relying on caller shell state.
  ONEAPI_DEVICE_SELECTOR: "level_zero:0"
  # ONEAPI_DEVICE_SELECTOR: "opencl:gpu"
  # Enable Level Zero Sysman so llama.cpp can query actual free device memory.
  ZES_ENABLE_SYSMAN: "1"

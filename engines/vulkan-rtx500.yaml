# NVIDIA RTX 500 Ada Vulkan engine for the Laptop_WSL instance.
# AI Workstation supplies the concrete llama.cpp binary directory at runtime.

environment:
  GGML_VK_VISIBLE_DEVICES: "1"

common:
  n-gpu-layers: 99
  split-mode: none
  main-gpu: 0
  flash-attn: true

serve:
  no-kv-offload: true
  cache-ram: 0
